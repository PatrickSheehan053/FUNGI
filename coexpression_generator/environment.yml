name: hyphae
# Conda environment for running HYPHAE on UNC Longleaf (CPU only).
# Create once with:   module load anaconda/2024.02 && conda env create -f environment.yml
# Then in the sbatch:  conda activate hyphae
#
# Python 3.11 is what Longleaf's anaconda/2024.02 ships and what these pins are tested against.
# Everything here is CPU-only — no CUDA, no GPU packages needed.
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.26,<2.1        # 2.x is fine; kept <2.1 to avoid churn with anndata/scipy pins
  - pandas>=2.0
  - scipy>=1.11
  - anndata>=0.10           # reads the SPORE .h5ad
  - h5py>=3.10              # backing store for .h5ad
  - pyarrow>=14             # writes/reads the .parquet edge chunks
  - joblib>=1.3             # parallel per-gene workers
  - lightgbm>=4.0           # the GRNBoost2/GENIE3-style regressor (the core of HYPHAE)
  - scikit-learn>=1.3       # not strictly required, handy for sanity checks
# If conda solving is slow on Longleaf, an equivalent pip install into a fresh py3.11 venv works too:
#   python -m venv hyphae && source hyphae/bin/activate
#   pip install "numpy<2.1" pandas scipy anndata h5py pyarrow joblib lightgbm scikit-learn
