# RPE1 CANARY config for the coverage-fixed one-stop SPORE (exp_009.1 rebuild validation).
# Runs the FULL local RPE1 raw single-cell through the rebuilt pipeline and emits the HYPHAE-ready
# substrate + coverage/firewall gate in ONE invocation:
#   python SPORE_light/spore_light.py --config configs/spore_light_config_rpe1_canary.yaml
# RPE1 (247,914 cells < 500k) uses the in-process (small) path — the same path VCC would use.

spore_plus_path: C:/Users/studi/OneDrive/Documents/thesis/OBJECTS/obj_009.1_topology_aware_gnn_v2/HPC_v2_launch/HPC_K562_SPORE_launch/SPORE_light

paths:
  # Outputs go to the local scratchpad (NOT OneDrive) so multi-GB intermediates don't churn OneDrive sync
  # during the run. Code lives in the package via the absolute spore_plus_path above; raw_h5ad is absolute.
  project_root: C:/Users/studi/AppData/Local/Temp/claude/c--Users-studi-OneDrive-Documents-thesis/f5cd153d-7ebc-43a7-92e8-8ed13c8846c7/scratchpad/rpe1_canary
  raw_h5ad: C:/Users/studi/OneDrive/Documents/thesis/DATA/scRNA-seq/rpe1_raw_singlecell_01_sparse.h5ad
  processed_dir: spore_out_rpe1_canary/processed     # FRESH dir every run (never reuse an old spore_out)
  splits_dir:    spore_out_rpe1_canary/splits
  figures_dir:   spore_out_rpe1_canary/figures
  log_dir:       spore_out_rpe1_canary/logs

dataset:
  name: RPE1_canary
  organism: human
  cell_type: RPE1
  perturbation_col: gene
  control_label: non-targeting
  perturbation_type: CRISPRi
  gene_id_format: ensembl           # Replogle var = ensembl; var['gene_name'] holds the symbol (offline map)

runtime:
  n_jobs: 6
  sparse_on_load: true
  memory_monitor: true
  large_dataset_mode: auto
  large_dataset_threshold: 500000   # 247k < threshold -> in-process (small) path
  checkpointing: true

phase0_ingestion: {chunk_size: 50000}
phase1_detection:
  enabled: true
  gene_id_harmonization: true
  modality_detection: false
  combinatorial_detection: false
  cell_line_detection: false

phase2_cell_triage:
  mt_method: explicit_list
  mt_threshold: 0.2
  mt_genes: [MT-ND1, MT-ND2, MT-ND3, MT-ND4, MT-ND4L, MT-ND5, MT-ND6, MT-CO1, MT-CO2, MT-CO3, MT-ATP6, MT-ATP8, MT-CYB]
  ribo_prefixes: [RPL, RPS]
  min_genes_per_cell: 200
  max_genes_per_cell: 10000
  min_counts_per_cell: 500
  max_counts_per_cell: 80000

phase3_ambient: {enabled: false}
phase4_doublets: {enabled: false}
phase5_escaper_filtering:
  efficiency_threshold: 0.5
  escaper_percentile: 10
  min_cells_per_perturbation: 50
  direction: auto

phase6_gene_triage:
  min_cells_expressing: 10
  pct_filter: 0.01
  mean_umi_threshold: 0.25
  rescue_perturbation_targets: true
  rescue_combinatorial_constituents: false

phase7_splits:
  mode: zero_shot
  random_seed: 42
  stratify_bins: 4
  test_n: 306                       # ~20% test / ~10% val of surviving perts
  val_n: 153

phase8_hvg:
  enabled: true
  n_top_genes: 5000
  method: seurat_v3
  rescue_perturbation_targets: true
  protected_gene_list: null         # held-out target force-carry is AUTOMATIC (Defect 2) — no hand list needed

phase9_normalization: {target_sum: 10000, log_transform: true, method: lognorm}

phase10_confounders:
  cell_cycle_regression: true
  s_genes: tirosh2016
  g2m_genes: tirosh2016
  # batch_key now READ from here (Defect 5 fix). RPE1's batch column is 'gem_group' (underscore).
  batch_correction: {enabled: true, method: harmony, batch_key: gem_group, confounding_ari_threshold: 0.5, min_cells_per_batch: 50}
  imputation_prohibited: true
  fit_on_train_only: true

phase11_cell_line: {enabled: false}

phase12_metacell:
  enabled: true
  mbk_k: 2                          # control-preserving MBK k=2 (the blessed 2x ceiling)
  seed: 42

plotting: {style: dark, dpi: 150, save_figures: false, figure_format: png}
output: {cleanup_intermediates: false, generate_report: true}
