# =============================================================================
# FUNGI v9.3 — Pipeline Configuration
# =============================================================================
# Changes from v9.2:
#   - refinement: REBUILT for the region-capped archive search (refinement.py
#     v3.0). New keys: max_basins, cluster_pool_cap, frontier_shortlist_k,
#     global_improve_patience, min_fitness_improvement, redetection_passes,
#     region_samples_per_round, trust_region.* . dbscan_eps/min_samples raised
#     to sane 6-D values (0.9 / 12). Old basin-budget keys retained but unused.
#   - secondary_objective: NEW. The mode-symmetric "yin-yang" second objective.
#     organic 0-loss graphs are pulled toward FAGCN-ideal structure; synthetic
#     0-loss graphs toward biology. One Derringer–Suich desirability scalar.
#   - synthetic_targets: NEW tightening knobs (window_tighten_frac,
#     weight_entropy_max, demote_to_secondary, demote_weight) applied in the
#     notebook between Phase 0 and Phase 3 to stop the ~18% Sobol zero-loss rate.
#
# Modular DASH kernel exponents:
#   beta(weight) delta(ffl) psi(pert_impact) nu(rdf) m_intra(intra-community
#     boost, session 5) -> hyperparameter_bounds (searched, 8D as of session 5)
#   eta_bridge(scber) -> effective_resistance.eta_inter (fixed, toggleable)
#   zeta_chi(chi_s/t) -> chi_prior.zeta (fixed, toggleable)
#   kappa,k_core,lambda -> selection geometry (searched)

input:
  # Session 4 (23 June 2026): production default is now SHROOM_2 (PSGRN-
  # SelfTrain), promoted to be the new shroom.py after winning a head-to-head
  # FUNGI comparison against the old elastic-net SHROOM (now archived as
  # shroom_1.py): champion loss 0.25 vs 7.13, 3/6 vs 1/6 organic topology
  # targets, and the first correctly-signed (negative) assortativity this
  # project has produced on any SHROOM-family substrate. Full investigation,
  # including two negative-result attempts at a GPU PSGRN-Causal candidate:
  # markdowns/claude_code/claude_code_session_4.md.
  # DATA/SHROOM_outputs/ reorganized into one subfolder per candidate (same
  # session) -- other candidates:
  #   shroom_1_elastic_net/RPE1_5k_essential_dense_graph.parquet (retired, plus
  #     RPE1_1k/ for the 1,501-gene panel)
  #   shroom_4_causal/RPE1_5k_essential_causal_dense_graph.parquet (negative result)
  # exp_006 promotion (session 12, 29 June 2026): the DEFAULT substrate is now the
  # MD-ensemble fusion `fuse_weighted_w25` (0.25*rank(PSGRN) + 0.75*rank(MD)),
  # generated by SHROOM/md_ensemble_fusion.py from the PSGRN Self-Train dense graph
  # + a leakage-safe interventional Mean-Difference channel. exp_006 showed it gives
  # the best causal precision (stat_prec), +15% at K=100k vs pure PSGRN, with no
  # biological regression. To revert: point back at shroom_2_selftrain below.
  # ---------------------------------------------------------------------------
  # DECISION (2 July 2026, Report_019 / exp_015; sessions exp_014, exp_014b, exp_015):
  # SUBSTRATE REVERTED TO PURE PSGRN-SelfTrain. The MD-ensemble question is closed
  # for the dense-graph line. MD-fusion improves ONLY stat_prec, which is circular
  # with the MD channel by construction (both estimate the same perturbation-response
  # quantity; cf. CausalBench's mean-Wasserstein metric = MD-as-scoreboard). On every
  # perturbation-INDEPENDENT axis (causal_epr, causal_auroc) AND FUNGI topology, pure
  # PSGRN is strictly better: exp_015 rebuilt FUNGI on md_wass_w50 -> within-lit 2/6
  # (S_max + reciprocity structurally UNREACHABLE) vs pure-PSGRN 5/6, causal_epr 2.04
  # vs 2.34 @50k. MD's only benefit is confined to a metric whose value depends on a
  # SPECTRA-downstream need not yet demonstrated (open: exp_016 SPECTRA-proxy).
  # md_ensemble_fusion.py is RETAINED (disable-don't-delete): to re-enable MD, point
  # graph_path back at shroom_2_md_w25 (or regenerate a w50/w75 blend). The current
  # phase6_champion/ (qprior_mintra, pure PSGRN, exp_004d) is now SUBSTRATE-CONSISTENT
  # with this pointer -- no champion rebuild needed to re-align substrate + champion.
  #   MD-heavy substrate (retained, switchable):
  #     shroom_2_md_w25/RPE1_5k_essential_md_w25_dense_graph.parquet
  # ---------------------------------------------------------------------------
  # exp_035 (session, 15 July 2026): sc_data_path REPOINTED from the production
  # default (old Jun-20 RPE1_5k_essential_train_metacell.h5ad, which shares only
  # 4640/5000 genes with the recovered panel and is in a DIFFERENT order) to the
  # exp_022 RECOVERED hybrid-metacell train adata. This adata's var_names match
  # the LFC panel (exp_030 lfc_targets_rpe1_cellhalf.npz) AND both fused pillars
  # (recovered SHROOM causal + HYPHAE hybrid-ctrlpreserved co-expression) EXACTLY:
  # 5000/5000, same order. It is also the exact adata the exp_025 shroom_cache
  # (which produced the verified exp_033 causal_lam44 failure anchor) was built on.
  # Using the old adata would silently drop 360 genes and misalign the fusion.
  # graph_path is unused by build_fungi_cache.py (--graph overrides it) and by
  # fungi_prune.py (reads the cache); left as-is for provenance.
  graph_path: "../DATA/SHROOM_outputs/shroom_2_selftrain/RPE1_5k_essential_selftrain_dense_graph.parquet"
  sc_data_path: "c:/Users/studi/OneDrive/Documents/thesis/DATA/EXPERIMENTS/exp_025_hyphae_vs_shroom_ensemble/rpe1_run/RPE1_hybrid_train_lognorm.h5ad"
  perturbation_column: "gene"   # RPE1's obs column name (VCC used "target_gene")
  control_label: "non-targeting"
  is_metacell: true
  metacell_pooling_factor: 10

experimental_grn:
  enabled: false
  alpha_md: 0.5

output:
  root_dir: "../DATA/FUNGI_outputs"
  phases:
    - "phase0_diagnostics"
    - "phase1_ingestion"
    - "phase2_normalization"
    - "phase3_expansive_search"
    - "phase5_refinement"
    - "phase6_champion"
  figures_dir: "../DATA/FUNGI_outputs/figures"

lambda_user:
  target: 40         # edges per gene — center of search range
  halfwidth: 10      # search range: [30, 50]

# Bounds override — bypasses the probe result for listed parameters only.
# Use when probe confidence is too low or a substrate mismatch makes a probe's
# bound unreliable or unreachable. Params not listed here stay fully
# probe-driven. Format: [lo, hi] (confidence defaults to 1.00, user-declared/
# fully trusted) or [lo, hi, conf] to set confidence explicitly.
# Known probe keys: alpha, gini, gini_in, S_max, C, rho
# Applied in diagnostics.py's run_diagnostics, after probes run — the probe
# functions themselves are never modified.
#
# REMOVED (session 4, 22 June 2026): the alpha/gini/gini_in/C override values
# below were hand-picked in session 3 to compensate for those probes always
# reporting FALLBACK_CONFIDENCE=0.25. Session 4 found the real cause: _gini()
# called np.trapz, removed in NumPy 2.0 (this venv runs 2.4.4) -- every call
# was silently raising AttributeError and falling through to hard-coded
# fallback bounds, identically regardless of which dense graph was scored.
# Not a substrate-calibration gap. Fixed in diagnostics.py (np.trapz ->
# np.trapezoid); probes now produce real, substrate-aware 0.63-0.70-confidence
# bounds on their own. Re-overriding them would silently discard a now-working
# probe for no remaining reason. Full story: markdowns/claude_code/
# claude_code_session_4.md Section 4. If a genuine new substrate-mismatch case
# turns up later, re-add entries here -- but verify it isn't this bug again.
# exp_004d promotion (session 12): Q encoded as a directionality-corrected
# biological PRIOR [0.25, 0.40] (directed Leicht-Newman TRN band; NOT the
# co-expression [0.25,0.50]). Q is substrate-ceiling-limited (~0.19 on the
# parent; exp_004c/006), so it is a prior, not a measured probe -- the achieved
# champion Q (~0.24 via m_intra) documents the probe-vs-substrate gap. The
# qprior_mintra arm won the exp_004d promotion gate (within-lit 5/7, biology
# within tolerance). Paired with hyperparameter_bounds.m_intra [1.0,4.0] below,
# which is the lever that lets FUNGI legitimately chase this prior.
# exp_010 lock (session 14): Q is DISABLED below, so its override is moot and
# removed; reciprocity is the adopted target -- its band IS the literature prior
# [0.02,0.12] (Garlaschelli 2004), supplied here (diagnostics also FALLBACK-defaults it).
bounds_override: {reciprocity: [0.02, 0.12]}

diagnostics:
  n_bootstrap: 200
  de_method: "wilcoxon"
  de_pval_threshold: 0.05
  de_lfc_threshold: 0.25
  knn_k_range: [5, 10, 15, 20]
  weight_floor: 1.0
  weight_ceiling: 50.0
  max_cells_for_de: 20000
  max_perts_for_de: 500
  n_jobs: 6   # local machine: 6 physical cores (was 16 on HPC; 12 logical via hyperthreading, but matching to physical cores avoids contention on CPU-bound numpy/scipy work)
  bound_constraints:
    alpha:   { delta_min: 0.28, delta_max: 0.80, hard_floor: 1.1, hard_ceiling: 4.0 }
    gini:    { delta_min: 0.20, delta_max: 0.40, hard_floor: 0.0, hard_ceiling: 1.0 }
    gini_in: { delta_min: 0.10, delta_max: 0.40, hard_floor: 0.0, hard_ceiling: 1.0 }
    S_max:   { delta_min: 0.02, delta_max: 0.10, hard_floor: 0.01, hard_ceiling: 0.30 }
    Q:       { delta_min: 0.10, delta_max: 0.40, hard_floor: -0.5, hard_ceiling: 1.0 }
    C:       { delta_min: 0.05, delta_max: 0.30, hard_floor: 0.0, hard_ceiling: 0.35 }
    rho:     { delta_min: 0.10, delta_max: 0.40, hard_floor: -1.0, hard_ceiling: 1.0 }

# Organic topology targets -- per-target on/off (session 5). Mirrors
# dash_kernel's existing modularity pattern, but for the OUTPUT side (loss
# targets) instead of the INPUT side (kernel factors): enabled: false forces
# that target's loss_weight to exactly 0.0 in run_diagnostics, which removes
# it from calculate_utopia_loss's sum entirely (the existing smooth-penalty
# term already multiplies by this weight -- no separate gating logic needed
# in engine.py). The probe still runs and its bound/confidence/probe_used
# are still computed, stored, and printed/reported normally -- disabling a
# target hides it from the OPTIMIZER, not from the diagnostics. Lets you,
# e.g., run with Q disabled to see m_intra's effect in isolation without
# touching any of Q's own code.
# exp_010 LOCK (session 14, "disable, don't delete"): gini_out + Q are proven
# unreachable on this substrate (exp_004d/007/008) -> DISABLED (loss_weight 0,
# code intact, re-enableable if a future dense-graph technique e.g. HYPHAE revives
# them). reciprocity adopted as the reachable + probe-able replacement (exp_010).
organic_targets:
  alpha:   { enabled: true }
  gini:    { enabled: false }   # gini_out: DISABLED (unreachable; kept in code)
  gini_in: { enabled: true }
  Q:       { enabled: false }   # DISABLED (unreachable here; kept in code)
  S_max:   { enabled: true }
  C:       { enabled: true }
  rho:     { enabled: true }
  reciprocity: { enabled: true }   # ADOPTED (exp_010); band from bounds_override

effective_resistance:
  enabled: true
  epsilon: 0.35
  eta_inter: 0.28
  eta_feat: 0.0
  seed: 42
  # Leiden community detection for SCBER's bridge-edge identification on
  # G_work (session 4 redesign -- see effective_resistance.py module
  # docstring for the full rationale, and claude_code_session_4.md Section
  # 12). No longer matched against a fixed target Q (the original design's
  # "Q (modularity)" topology target it was coupled to has been removed --
  # see Section 8 of the same log). Sweep ascending, take the first
  # resolution producing at least leiden_min_communities communities with
  # no single community exceeding leiden_max_dominant_fraction of all
  # nodes. Empirically (RPE1 5k, 25% prefilter density): resolution 1.3 is
  # the first to clear both bars (305 communities, largest 17% of nodes);
  # lower resolutions collapse to 1-2 (lopsided) communities; resolution
  # >= 2.5 over-fragments into near-singletons with negative modularity.
  leiden_resolutions: [0.3, 0.5, 0.8, 1.0, 1.3, 1.6, 2.0]
  leiden_min_communities: 10
  leiden_max_dominant_fraction: 0.5

chi_prior:
  enabled: true
  zeta: 0.5
  # leiden_resolutions/leiden_target_q removed from this section (session 4)
  # -- dead config, never consumed. compute_chi_prior() (engine.py) takes
  # deg_col_sums/n_genes/zeta directly and does no community detection of
  # its own; SCBER's Leiden call (effective_resistance.py, configured
  # above) is the only one that exists.

causal_weight:
  gamma: 2.0

prefilter:
  target_density: 0.25

dash_kernel:
  weight:      { enabled: true }
  ffl:         { enabled: true }
  pert_impact: { enabled: true }
  rdf:    { enabled: true }
  scber:       { enabled: true }
  chi_s:       { enabled: true }
  chi_t:       { enabled: true }
  rho:         { enabled: true }
  m_intra:     { enabled: true }  # session 5: false forces intra-community
                                   # boost to identity (1.0) regardless of
                                   # the searched m_intra value, same as the
                                   # other kernel-chain factors above.

hyperparameter_bounds:
  beta:   [0.5, 4.0]
  delta:  [0.0, 3.0]
  kappa:  [0.02, 0.35]
  k_core: [8.0, 28.0]
  lambda_density: [0.006, 0.010]
  psi:    [0.0, 3.0]
  nu:     [0.0, 2.0]
  # m_intra (session 5, 8th searched HP): multiplicative boost on intra-
  # community edges (SCBER's own Leiden partition, reused). Lower bound 1.0 =
  # no effect (identity, backward compatible); upper bound 2.5 gives
  # intra-community edges up to a 2.5x scoring advantage -- enough to shape
  # community structure without overwhelming the W_q backbone. Added so the
  # optimizer has a positive force toward modularity to counterbalance
  # SCBER's inter-module bridge promotion, enabling Q's restoration below.
  # exp_004d promotion (session 12): widened [1.0,2.5]->[1.0,4.0]. The extra
  # intra-community reach is what lets FUNGI legitimately satisfy the Q-prior
  # (achieved Q 0.190->0.239) AND recover prec@1k that the default m_intra cost
  # -- the "fix FUNGI to reach biology, don't soften the probe" lever. Validated
  # by the qprior_mintra arm winning the exp_004d gate.
  m_intra: [1.0, 4.0]

expansive_search:
  n_samples: 8192  # raised from 4096 (session 5): 7D -> 8D with m_intra added;
                   # doubled to maintain per-dimension Sobol coverage.
                   # to 8192 after exp_002's FUNGI step completes.
  n_workers: 6   # local machine: 6 physical cores (was 16 on HPC)
  chunk_size: 6  # mirrors n_workers
  random_seed: 42

shatter:
  max_orphan_fraction: 0.15
  min_gwcc_fraction: 0.50
  min_target_coverage: 0.40
  lambda_min: 2.0
  lambda_max: 55.0
  s_max_ceiling_multiplier: 2.0
  s_max_ceiling_hard_cap: 0.30
  min_clustering_gamma: 1.5
  synthetic_min_clustering: null

# niching: removed -- Phase 4 (niching.py KMeans anchors) was never consumed
# by refinement.py's region-capped search and has been retired from the
# notebook. The one piece of real value (KMeans as a basin-diversity backstop)
# now lives directly in refinement.py's _detect_basins() as an automatic
# fallback for when DBSCAN finds zero core clusters.

# -----------------------------------------------------------------------------
# Refinement (Phase 5) — parallel-region trust-region search (refinement.py v4.0,
# session 5 redesign). Previously split into a single-point "loss minimization"
# drill (used whenever Phase 3 never finds an EXACT zero-loss config -- the
# common case with several simultaneous hard biological targets) and a
# separate "density mode" region/GMM/online-surrogate archive search that only
# ever activated past that threshold. A real production run confirmed the
# threshold is essentially unreachable in organic mode (Phase 3 best 0.1809,
# never 0) and traced that the online surrogate was therefore never trained
# even once in 38 minutes / 7,564 evaluations (all 5 of its training call
# sites lived inside the now-removed density-mode block). Every region now
# runs the SAME trust-region search from round 1 in parallel, scoring by loss
# until it finds its own zero-loss survivor, then switching to the existing
# desirability-pull scoring independently. Full audit + design:
# markdowns/claude_code/claude_code_session_5.md Sections 8-9.
# -----------------------------------------------------------------------------
refinement:
  density_mode_epsilon: 1e-6        # "close enough to zero" threshold for a
                                     # region's own loss->desirability mode flip

  # surrogate / sampler (GMM + density-ratio TPE) — unchanged engine
  top_fraction: 0.05
  n_gmm_components: 5
  region_samples_per_round: 256    # per-region, per-round batch size (both modes)
  chunk_size: 6   # mirrors expansive_search.n_workers (was 16 on HPC)
  good_loss_quantile: 0.15
  bad_loss_quantile: 0.70

  # pre-rounds
  n_boundary_probes: 200
  run_delta_kcore_grid: true

  # ---- region/archive discipline (the basin-explosion fix) ----
  max_basins: 6                    # HARD cap on regions explored in parallel
  cluster_pool_cap: 2000           # subsample best-loss pool before DBSCAN
  frontier_shortlist_k: 12         # densest survivors scored for desirability per round
  global_improve_patience: 2       # stop the search once the global incumbent stalls
  min_fitness_improvement: 0.005   # absolute score gain that counts (both modes)
  redetection_passes: 2            # re-cluster the full grown archive when globally
                                    # stalled, swap in a new region if the surrogate's
                                    # cheap pre-score says it beats the worst active one.
                                    # Was 0 (a literal no-op stub) before session 5
                                    # implemented it for real.
  # dbscan_eps was 0.9 for 6D (raised from a 0.6 baseline to merge micro-basins
  # -- an empirical fix for a real fragmentation problem seen on actual graph
  # data). 0.97 here is a first-order analytical correction for 7D (now 8D with
  # m_intra): standardized per-axis variance is always ~1 after StandardScaler,
  # so expected squared distance between two points scales ~linearly with
  # dimension count, giving eps_7d ~= eps_6d * sqrt(7/6) ~= 0.97. This is a
  # placeholder, not a re-validated value -- the original 0.6->0.9 bump was
  # tuned against a specific observed symptom (micro-basin fragmentation) that
  # this formula doesn't know about. Once you have a real local Phase 3
  # result, validate (or re-pick) this with refinement.plot_kdistance_for_eps_tuning().
  dbscan_eps: 0.97
  dbscan_min_samples: 14           # ~2*dim for 7-8D, same rule as before

  trust_region:
    init_radius_frac: 0.25         # initial half-width as fraction of bound range
    min_radius_frac: 0.02          # terminate region below this
    expand_factor: 1.5
    shrink_factor: 0.5
    success_streak_to_expand: 2
    failure_streak_to_shrink: 2
    max_rounds_per_region: 12      # hard ceiling per region

  # ---- online surrogate (learns params -> desirability in real time) ----
  surrogate:
    enabled: true                  # RF learns the desirability surface from
                                   # winners AND losers as they accumulate, then
                                   # pre-screens GMM proposals (no GP; ms refit)
    min_points: 40                 # start screening once the archive has this many
    oversample: 6                  # GMM draws this multiple before screening
    score_full_round: false        # reserved (score every survivor, not just k)

# -----------------------------------------------------------------------------
# Secondary objective — the mode-symmetric "yin-yang" pull (refinement.py v3.0)
# -----------------------------------------------------------------------------
# Once a mode holds 0 loss on its OWN primary windows, the second search pulls the
# graph toward the OTHER domain's ideal, via one Derringer–Suich desirability
# scalar (weighted geometric mean). Density is a floor toward density_ref.
# Cross-domain target windows below are FALLBACKS. At runtime the notebook re-runs
# the OTHER domain's probes on the dense parent graph and passes those
# target-specific windows as secondary_windows, which OVERRIDE these per metric
# (keeps FUNGI custom-per-target). Density is NOT a desirability pillar (weight 0);
# density_floor_edges remains a hard guard. Metric defs mirror engine.py exactly.
secondary_objective:
  enabled: true
  density_floor_edges: 50000       # below this a graph scores 0 (hard biological floor)
  density_ref_quantile: 0.95       # density desirability ref = q95 of the archive

  # BIOLOGIC mode -> pull biological 0-loss graphs toward FAGCN-ideal structure.
  # exp_011 Item 2 (Patrick: re-derive on the correct scale): the heterophily/
  # spectral_gap windows are now on the SAME scale the loss/probe metric uses, not
  # the old cross-community-FRACTION numbers. heterophily = mean edge feature
  # COSINE-DISTANCE (engine.calculate_synthetic_loss / refinement._heterophily),
  # substrate mean ~0.15 (probe range [0.056,0.256]); spectral_gap = lambda_2 of
  # the normalised Laplacian, substrate ~0.001-0.015. The windows translate the
  # literature DIRECTION onto that measured scale: Bo 2021 (FAGCN favours higher
  # heterophily / high-frequency content -> pull ABOVE the substrate's 0.15, but
  # intermediate not maximal) and Rusch 2023 / Di Giovanni (intermediate spectral
  # gap -> pull the over-squashed substrate's tiny lambda_2 UP toward better mixing,
  # well below the over-smoothing regime). SOFT aspirational pull targets; to be
  # empirically recalibrated once SPECTRA/FAGCN is trained and can measure which
  # values actually improve prediction.
  # obj_006.1 REFIT (session 18): oversquashing-grounded, directions theory-certain.
  #   epr_k     = MAXIMIZE (reachability; higher-is-better, no floor -> anti-laziness);
  #               already a _MAX_METRIC in refinement.SecondaryObjective.
  #   eff_resist= SWEET-SPOT window (source->DEG effective resistance; lower relieves
  #               oversquashing (Di Giovanni 2023) but too-low = densified/oversmoothed).
  # REMOVED (mis-grounded, session-18 lit pass): heterophily (FAGCN is frequency-
  #   ADAPTIVE -> no ideal heterophily to target), weight_entropy + source_conc
  #   (unsupported), spectral_gap (superseded by the source->DEG eff_resist quantity).
  # eff_resist window is a SUBSTRATE-CALIBRATED placeholder on the JL-sketch ER scale
  #   (like the old FAGCN windows) -- SOFT; recalibrate empirically once SPECTRA trains
  #   (obj_006.1 harvest hook). Directions are theory-certain so NO SPECTRA-in-the-loop
  #   calibration is required to promote.
  biologic_to_synthetic:    # exp_011 Item 6 rename (legacy: organic_to_synthetic)
    metrics: ["epr_k", "eff_resist"]
    windows:
      # obj_006.1 substrate-calibrated placeholder (mbk_k2_ctrl_fine 0-loss set, p10-p60 of the
      # JL-sketch source->DEG ER; validate_max.py). SOFT/aspirational -- still PROBE-OVERRIDDEN at
      # run time via secondary_windows (recompute per substrate); recalibrate empirically vs
      # pcc_delta once SPECTRA trains (harvest hook). Direction is theory-certain; center aspirational.
      eff_resist: [175.0, 288.0]
    weights: { epr_k: 1.0, eff_resist: 1.0, density: 0.0 }
    compute_spectral_on: "never"     # eff_resist uses the JL sketch, not an eigensolve

  # SYNTHETIC mode -> pull FAGCN 0-loss graphs toward biology.
  # exp_011 Item 1: the FINALIZED LIVE biologic set {alpha, gini_in, S_max, C, rho,
  # reciprocity} (gini_out + Q DISABLED -> EXCLUDED, exp_010 lock), + epr_k anchor.
  # Windows are FALLBACKS -- the notebook re-runs the diagnostics_v2 biologic probes
  # (+ reciprocity prior [0.02,0.12]) on the dense parent and passes them as
  # secondary_windows, which OVERRIDE these per metric (Item 3). Mirrors
  # refinement._default_secondary_cfg("synthetic"); keep the two in sync.
  synthetic_to_biologic:    # exp_011 Item 6 rename (legacy: synthetic_to_organic)
    metrics: ["epr_k", "alpha", "gini_in", "S_max", "C", "rho", "reciprocity"]
    windows:
      alpha:       [2.22, 2.50]    # scale-free exponent (diagnostics_v2 gini-derived)
      gini_in:     [0.55, 0.69]    # in-degree concentration (gi_isodensity_shrunk)
      S_max:       [0.089, 0.18]   # largest hub target fraction (smax_rpe1_prior)
      C:           [0.097, 0.157]  # feed-forward-loop density (c_isodensity_global)
      rho:         [-0.31, 0.0]    # hub-to-effector disassortativity
      reciprocity: [0.02, 0.12]    # directed link reciprocity (literature prior)
    weights: { epr_k: 1.5, alpha: 0.8, gini_in: 0.6, S_max: 0.6, C: 0.6,
               rho: 0.4, reciprocity: 0.6, density: 0.0 }
    compute_spectral_on: "never"

pagerank_kappa:
  alpha: 0.85
  n_iter: 60
  hub_percentile: 99.0
  hub_multiplier: 3.0

audit:
  cohort_size: 1

runtime:
  single_threaded_blas: true
  random_seed: 42
  log_level: "INFO"

# GPU acceleration (RTX 2070 Max-Q / Turing SM 7.5). When enabled, the
# notebook calls engine.init_gpu_context() once before Phase 3, and
# SearchEvaluator.evaluate() (used by both Phase 3's Sobol search and every
# evaluator.evaluate() call inside Phase 5's refinement) automatically routes
# through the single-process GPU batched path instead of Ray, falling back
# to the existing CPU/Ray path automatically if CUDA is unavailable or the
# GPU path raises.
gpu:
  enabled: true
  use_ray_pipeline: true  # per-eval topology (select_edges/_motif_repair_swap/etc.) dispatched
                          # to n_workers Ray processes instead of a sequential loop. Verified
                          # 6.43x faster on the real 4096-eval Sobol sweep (108.4min -> 16.86min),
                          # bit-identical results. Set false to force the single-process GPU path.
  batch_size: null        # null = auto-size from VRAM budget at init time
  vram_budget_gb: 7.0      # leaves ~1GB headroom on the 8GB 2070 Max-Q. The formula
                           # already has a 1.5x safety margin baked in and counts the
                           # 2 extra int64 tensors the argsort step produces (not just
                           # the float32 omega tensor), so this is less aggressive than
                           # it looks. NOTE: not actually wired to _choose_gpu_batch_size's
                           # call site in search.py (pre-existing gap) -- that function's
                           # own default controls batch size; kept in sync by hand.
  n_ffl_buckets: 8         # precomputed FFL k_core buckets (nearest-lookup, not interpolated)

# exp_011 Item 6: canonical mode is "biologic" (legacy "organic" still accepted
# everywhere via back-compat aliases). Set to "synthetic" for the FAGCN frontier.
fungi_mode: "biologic"

# -----------------------------------------------------------------------------
# Synthetic targets — probe windows + NEW primary-objective tightening
# -----------------------------------------------------------------------------
synthetic_targets:
  spectra_depth_L: 3                      # matches SPECTRA (L=3) -- GROUNDED, keep
  min_reach_frac: 0.5
  # obj_006.1 REFIT: PRIMARY synthetic loss = {epr_k floor (satisfiable), eff_resist
  # sweet-spot}. The maximisation of epr_k happens in the SECONDARY (yin-yang) among
  # 0-loss graphs; the PRIMARY only needs a REACHABLE floor so 0-loss exists (fixes
  # exp_012's 0/8037 unsatisfiability -- floor lowered so it lands ~0.40, pruned graphs
  # reach ~0.44; exp_015 H2 recalibration confirmed 0->225 zero-loss).
  epr_k_floor_fraction:   0.55            # exp_012/015 loosened (was 0.70 -> unreachable)
  eff_resist_window:      [175.0, 288.0]  # obj_006.1 substrate-calibrated (see biologic_to_synthetic)
  exact_spectral_finalists: true
  # REMOVED from the primary synthetic loss (mis-grounded, session-18 lit pass):
  #   weight_entropy_floor / source_conc_window / heterophily_window / spectral_gap_window.
  # Kept here as disabled comments ("disable, don't delete") for provenance:
  #   weight_entropy_floor: 3.80  ;  spectral_gap_window: 0.35
  #   source_conc_window:   0.40  ;  heterophily_window:  0.10

  # NEW: applied in the notebook (synthetic mode) between Phase 0 and Phase 3 to
  # stop the primary objective being trivially satisfiable (~18% Sobol 0-loss).
  #   * tighten the two GENUINE windows toward their probed centre
  #   * cap weight_entropy's unphysical 7.0 ceiling -> a real two-sided window
  #   * demote the MONOTONIC "floor-in-disguise" metrics out of the primary loss
  #     (they re-enter as maximise objectives in secondary_objective above)
  window_tighten_frac: 0.0              # narrow spectral_gap & heterophily windows
  weight_entropy_max: 5.20               # cap (below 50-bin log2 max ~5.644)
  # exp_011 Item 5 (Patrick's decision, session 14): source_conc is KEPT as a
  # two-sided PRIMARY window (NOT demoted). Rationale: high source concentration
  # does NOT monotonically help FAGCN -- super-hubs cause GNN over-smoothing/
  # over-squashing (Rusch 2023; Di Giovanni et al.) and break the S_max biology
  # target -- so an unbounded maximise is wrong; a moderate two-sided window
  # (engine.calculate_synthetic_loss already penalises it against its probe window
  # ~[40,94]) is the right treatment. demote list now empty. EPR@k still a primary
  # floor AND maximised in the secondary.
  demote_to_secondary: []
  demote_weight: 0.0