# =============================================================================
# FUNGI v7.1 -- Pipeline Configuration
# =============================================================================

input:
  graph_path: "/scratch/patrick.sheehan/MYCELIUM/SPORE_heavy/to_guanlab/VCC_metacell_master_graph.parquet"
  sc_data_path: "/scratch/patrick.sheehan/MYCELIUM/SPORE_heavy/processed/VCC_train_metacell.h5ad"
  perturbation_column: "target_gene"
  control_label: "non-targeting"
  is_metacell: true
  metacell_pooling_factor: 10

output:
  root_dir: "data/output"
  phases:
    - "phase0_diagnostics"
    - "phase1_ingestion"
    - "phase2_normalization"
    - "phase3_expansive_search"
    - "phase4_niching"
    - "phase5_turbo_refinement"
    - "phase6_audit"
  figures_dir: "data/output/figures"

diagnostics:
  n_bootstrap: 1000
  de_method: "wilcoxon"
  de_pval_threshold: 0.05
  de_lfc_threshold: 0.25
  knn_k_range: [5, 10, 15, 20]
  weight_floor: 1.0
  weight_ceiling: 50.0
  bound_constraints:
    alpha: { delta_min: 0.20, delta_max: 0.80, hard_floor: 1.8, hard_ceiling: 4.0 }
    gini:  { delta_min: 0.10, delta_max: 0.40, hard_floor: 0.0, hard_ceiling: 1.0 }
    S_max: { delta_min: 0.02, delta_max: 0.10, hard_floor: 0.01, hard_ceiling: 0.30 }
    Q:     { delta_min: 0.10, delta_max: 0.40, hard_floor: -0.5, hard_ceiling: 1.0 }
    C:     { delta_min: 0.05, delta_max: 0.30, hard_floor: 0.0, hard_ceiling: 1.0 }
    rho:   { delta_min: 0.10, delta_max: 0.40, hard_floor: -1.0, hard_ceiling: 1.0 }
  metacell_silhouette_midpoint: 0.60
  singlecell_silhouette_midpoint: 0.25

prefilter:
  target_density: 0.20

hyperparameter_bounds:
  beta:   [1.0, 5.0]
  gamma:  [0.0, 2.5]
  delta:  [0.0, 1.0]
  kappa:  [0.02, 0.08]
  k_core: [1.0, 15.0]
  lambda_density: [0.001, 0.020]

expansive_search:
  n_samples: 25000
  n_workers: 15
  chunk_size: 50
  random_seed: 42

# Structural-only shatter criteria.
# Alpha is scored in the utopian loss (weight 18.98), NOT killed here.
# The 99.7% shatter rate from scale_free_degeneration proved that a hard
# alpha floor kills viable graphs that the optimizer could improve.
shatter:
  max_edge_count: 500000
  max_orphan_fraction: 0.70
  max_hub_saturation: 0.15
  min_gwcc_fraction: 0.30
  min_clustering: 0.002

niching:
  top_fraction: 0.05
  n_clusters: 50

turbo:
  max_evaluations: 10000
  batch_size: 20
  initial_length: 0.05
  min_length: 0.001
  success_threshold: 3
  failure_threshold: 5

audit:
  cohort_size: 1

runtime:
  single_threaded_blas: true
  random_seed: 42
  log_level: "INFO"
