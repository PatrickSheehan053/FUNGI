# =============================================================================
# FUNGI v9.0 — Pipeline Configuration
# =============================================================================
# Key changes from v8.1:
#   - γ (gamma) removed from hyperparameter_bounds
#   - ψ (psi, perturbation impact prior) added [0.0, 2.0]
#   - β range reduced to [1.0, 3.0]
#   - k_core range extended to [8.0, 22.0]
#   - κ base range extended to [0.02, 0.15]
#   - refinement: boundary_probe and delta_kcore_grid added

input:
  graph_path: "/scratch/patrick.sheehan/SPORE+/GRN/GuanLab_Exp/VCC_chitin_exp_grn.parquet"
  sc_data_path: "/scratch/patrick.sheehan/SPORE+/output/chitin/VCC/VCC_h1_hESC_train_metacell_chitin.h5ad"
  perturbation_column: "target_gene"
  control_label: "non-targeting"
  is_metacell: true
  metacell_pooling_factor: 10

experimental_grn:
  enabled: true          # set false to ignore experimental columns even if present
  alpha_md: 0.5          # MD gate boost strength [0=no boost, 1=max boost]

output:
  root_dir: "data/output"
  phases:
    - "phase0_diagnostics"
    - "phase1_ingestion"
    - "phase2_normalization"
    - "phase3_expansive_search"
    - "phase4_niching"
    - "phase5_refinement"
    - "phase6_champion"
  figures_dir: "data/output/figures"

diagnostics:
  n_bootstrap: 200
  de_method: "wilcoxon"
  de_pval_threshold: 0.05
  de_lfc_threshold: 0.25
  knn_k_range: [5, 10, 15, 20]
  weight_floor: 1.0
  weight_ceiling: 50.0
  max_cells_for_de: 20000
  max_perts_for_de: 500
  n_jobs: 15
  bound_constraints:
    alpha: { delta_min: 0.20, delta_max: 0.80, hard_floor: 1.1, hard_ceiling: 4.0 }
    gini:  { delta_min: 0.10, delta_max: 0.40, hard_floor: 0.0, hard_ceiling: 1.0 }
    S_max: { delta_min: 0.02, delta_max: 0.10, hard_floor: 0.01, hard_ceiling: 0.30 }
    Q:     { delta_min: 0.10, delta_max: 0.40, hard_floor: -0.5, hard_ceiling: 1.0 }
    C:     { delta_min: 0.05, delta_max: 0.30, hard_floor: 0.0, hard_ceiling: 0.35 }
    rho:   { delta_min: 0.10, delta_max: 0.40, hard_floor: -1.0, hard_ceiling: 1.0 }

prefilter:
  target_density: 0.10

hyperparameter_bounds:
  beta:   [1.0, 4.0]
  delta:  [0.0, 1.5]
  kappa:  [0.02, 0.15]
  k_core: [8.0, 28.0]
  lambda_density: null
  psi:    [0.0, 2.0]   # perturbation impact prior (NEW — replaces gamma)

expansive_search:
  n_samples: 4096
  n_workers: 15
  chunk_size: 16
  random_seed: 42

shatter:
  max_orphan_fraction: 0.15
  min_gwcc_fraction: 0.50
  min_target_coverage: 0.40
  lambda_min: 2.0
  lambda_max: 35.0
  s_max_ceiling_multiplier: 2.0
  s_max_ceiling_hard_cap: 0.30
  min_clustering_gamma: 1.5

niching:
  top_fraction: 0.05
  n_clusters: 10

# Phase 5: ML+GMM with boundary probe and 2D interaction grid
refinement:
  convergence_threshold: 0.0
  density_mode_epsilon: 1e-6
  top_fraction: 0.05
  n_gmm_components: 5
  n_samples_per_round: 500
  min_rf_confidence: 0.65
  chunk_size: 16
  n_boundary_probes: 200
  run_delta_kcore_grid: true
  # Exhaustion mode — replaces fixed n_rounds
  exhaustion_mode: true         # if true, ignore n_rounds and use patience instead
  n_rounds: 3                   # used only when exhaustion_mode: false
  patience: 2                   # stop after this many consecutive non-improving rounds
  # Density mode after hitting zero mid-refinement
  density_rounds_after_zero: 5        # max density rounds per basin
  density_patience: 1                  # was 2 — primary basins exhaust faster
  min_edge_improvement: 50
  basin_ceiling_gap_fraction: 0.08     # skip basins whose best is >8% below champion
  redetection_patience: 1              # re-detection basins get 1 round only            # minimum zero-loss solutions before density switch
  basin_expansion_rounds: 3           # loss-mode rounds to grow pool before density switch
  dbscan_eps: 0.6                     # DBSCAN neighborhood radius in normalized 6D space
  dbscan_min_samples: 3               # minimum points to form a basin core

# PageRank κ multiplier settings (applied in Phase 2)
pagerank_kappa:
  alpha: 0.85              # teleportation probability
  n_iter: 60               # power iteration steps
  hub_percentile: 99.0     # top 1% of nodes by PageRank get relaxed cap
  hub_multiplier: 3.0      # hub gene cap = κ_base × 3.0

audit:
  cohort_size: 1

runtime:
  single_threaded_blas: true
  random_seed: 42
  log_level: "INFO"
